services:
  postgres:
    image: postgres:16-alpine
    container_name: wisal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisal
      POSTGRES_PASSWORD: wisal
      POSTGRES_DB: wisal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
